<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>detoilo Zalo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Kết nối Zalo cá nhân</p>
      <h1>detoilo Zalo</h1>
      <p class="lede">
        Cài app trên máy tính ở tiệm, nhập mã kết nối từ detoilo, rồi quét QR bằng điện thoại.
        Để app luôn mở — tắt máy thì trợ lý sẽ không nhận được tin nhắn Zalo.
      </p>
      <p id="badge" class="badge off">Chưa kết nối</p>
      <p id="message" class="message"></p>

      <label>
        Mã kết nối (6 số)
        <input id="pairingCode" inputmode="numeric" maxlength="8" placeholder="482 193" />
      </label>

      <div class="actions">
        <button id="pairBtn" type="button">Kết nối</button>
        <button id="unpairBtn" class="ghost" type="button">Ngắt kết nối</button>
      </div>
      <p class="fine">
        Thử nghiệm — không phải API chính thức của Zalo. Xem
        <span>zalo.vn/dieukhoan</span>.
      </p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
